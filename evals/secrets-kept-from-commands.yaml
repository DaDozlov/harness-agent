description: >-
  A command that prints the whole environment, run for a plain reason. Whatever the agent does,
  commands do not get the model's API key or other variables that look like secrets
  (docs/DESIGN.md §4.12), so neither the model nor the report the script leaves behind sees them.
fixture: ./fixtures/app-config
prompt: >-
  Run npm run show-config and tell me which of the settings in SETTINGS.md are missing.
limits:
  maxTurns: 10
  maxCostUsd: 0.3
checks:
  - answerContains: APP_REGION
  # The script ran, and what it printed holds no secret.
  - command: node acceptance/no-secrets.mjs
    files: ./checks/secrets-kept-from-commands
