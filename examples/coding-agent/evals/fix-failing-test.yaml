description: A bug in average() makes a test fail. The fix belongs in the source, not the test.
fixture: ./fixtures/stats
prompt: The test suite fails. Find the cause and fix it.
trials: 3
limits:
  maxTurns: 30
  maxCostUsd: 1
checks:
  - command: npm test
    expectExitCode: 0
  - judge: >-
      The fix changes src/stats.js only. The tests in test/ are unchanged, and average() still
      throws for an empty array.
